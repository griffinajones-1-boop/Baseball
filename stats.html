<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Usage · At-Bat Log</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0 8px; }
    .kpis div { background: var(--surface); box-shadow: var(--shadow); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
    .kpis b { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
    .kpis span { font-size: .8rem; color: var(--muted); }
    table.days { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
    table.days th, table.days td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
    table.days th:first-child, table.days td:first-child { text-align: left; }
    table.days thead th { color: var(--muted); font-weight: 600; font-size: .72rem; }
    table.days td.zero { color: var(--muted); }
    .legend-list { padding-left: 1.1rem; color: var(--text-2); font-size: .85rem; }
  </style>
</head>
<body>
  <main class="page" id="root">
    <header class="top"><h1>Usage</h1><span class="spacer"></span></header>
    <p class="muted" id="status">Loading…</p>
  </main>
  <script type="module">
    const root = document.getElementById('root');
    const status = document.getElementById('status');
    const key = new URLSearchParams(location.hash.slice(1)).get('key');
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    async function load() {
      if (!key) { status.textContent = 'Open this page with the link that includes #key=…'; return; }
      const r = await fetch(`/api/stats?key=${encodeURIComponent(key)}`, { cache: 'no-store' });
      if (!r.ok) { status.textContent = r.status === 404 ? 'Wrong key, or the stats key isn\'t set up yet.' : `Error ${r.status}`; return; }
      const d = await r.json();
      const sum = (name, n) => d.days.slice(0, n).reduce((a, x) => a + (x.counts[name] || 0), 0);
      const kpi = (v, l) => `<div><b>${v}</b><span>${l}</span></div>`;
      const cols = ['open', 'new_device', 'game', 'first_game', 'game3', 'game10', 'share', 'feedback'];
      const short = { open: 'Active', new_device: 'New', game: 'Games', first_game: '1st game', game3: '3 games', game10: '10 games', share: 'Shares', feedback: 'Feedback' };
      const rows = d.days.filter((x) => Object.keys(x.counts).length).map((x) =>
        `<tr><td>${x.date.slice(5)}</td>${cols.map((c) => `<td class="${x.counts[c] ? '' : 'zero'}">${x.counts[c] || 0}</td>`).join('')}</tr>`).join('');
      const firstGames = d.totals.first_game || 0, three = d.totals.game3 || 0;
      root.innerHTML = `<header class="top"><h1>Usage</h1><button class="link" id="refresh">Refresh</button></header>
        <p class="muted">Last 60 days. Days are UTC.</p>
        <div class="kpis">
          ${kpi(sum('new_device', 7), 'New devices, last 7 days')}
          ${kpi(sum('game', 7), 'Games started, last 7 days')}
          ${kpi(firstGames, 'Devices that logged a first game')}
          ${kpi(firstGames ? `${Math.round((three / firstGames) * 100)}%` : '—', 'Of those, reached 3 games')}
        </div>
        <h2 class="section">By day</h2>
        ${rows ? `<div class="table-wrap"><table class="days"><thead><tr><th>Date</th>${cols.map((c) => `<th>${short[c]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted">No activity yet.</p>'}
        <h2 class="section">What each count means</h2>
        <ul class="legend-list">${Object.entries(d.events).map(([k, v]) => `<li><b>${esc(k)}</b> (${d.totals[k] || 0} total): ${esc(v)}</li>`).join('')}</ul>
        <p class="hint">"Active" counts each device once per day, so a weekly number would double-count people who open it on several days.</p>`;
      document.getElementById('refresh').onclick = load;
    }
    load().catch((e) => { status.textContent = `Could not load: ${e.message}`; });
  </script>
</body>
</html>
