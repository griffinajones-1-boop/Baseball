[build]
  publish = "."
  command = ""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/verify"
  to = "/.netlify/functions/verify"
  status = 200
