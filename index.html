<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bleacher Stats</title>
  <meta name="description" content="Log your kid's at-bats pitch by pitch. Works offline; data stays on your phone.">
  <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="Bleacher Stats">
  <meta property="og:description" content="Log your kid's at-bats pitch by pitch. See what they swing at, what they miss, and how it changes over the season.">
  <meta property="og:type" content="website">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bleacher Stats">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><p style="padding:16px">Loading…</p></div>
  <noscript><p style="padding:16px">Bleacher Stats needs JavaScript turned on.</p></noscript>
  <!-- Declares the feedback form for Netlify Forms; the app submits it with fetch. -->
  <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field"><input name="kind"><textarea name="message"></textarea><input name="email"><input name="context">
  </form>
  <script type="module" src="js/app.js"></script>
</body>
</html>
